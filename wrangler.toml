name = "todaymoonemoji"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets — serves the static export from ./out
# This makes `npx wrangler deploy` work as a Worker that serves your static site.
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"
